name: Update SCImago rankings

# Rebuilds rankings.json from SCImago and commits it if the data changed.
# Runs monthly (cheap — it no-ops when nothing changed, so it simply catches
# SCImago's annual update whenever it lands) and can be run on demand from the
# Actions tab via the "Run workflow" button.
on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}

# Needed so the job can push the updated rankings.json back to the repo.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 majors — GitHub removes the older Node 20 action runtime in
      # Sept 2026, so pin current majors. Bump these if GitHub deprecates them.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Rebuild rankings.json
        run: node build-rankings.mjs --out rankings.json

      - name: Commit if the rankings changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rankings.json
          if git diff --cached --quiet; then
            echo "SCImago rankings unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "Update SCImago rankings ($(date -u +%Y-%m-%d))"
          git push
